<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Expense · Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { extend: { colors: { brand: { DEFAULT: "#38bdf8" } } } },
      };
    </script>
  </head>
  <body class="h-full bg-slate-900 text-slate-100 flex items-center justify-center">
  <section class="w-full max-w-xl rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-2xl mx-4">
    <h1 class="text-3xl font-semibold mb-2">Edit Expense</h1>
    <p class="text-slate-400 mb-6">Update the fields and save your changes.</p>
    
    <form method="post" action="{{ url_for('edit_post', expense_id=expense.id) }}" class="space-y-4">
      <label class="block text-sm">
        <span class="mb-1 block text-slate-300">Description</span>
        <input name="description"
               value="{{ expense.description }}"
               class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-slate-100 focus:outline-none focus:border-brand" required />
      </label>

      <div class="grid grid-cols-2 gap-3">
        <label class="block text-sm">
          <span class="mb-1 block text-slate-300">Amount ($)</span>
          <input type="number" step="0.01" min="0.01" name="amount"
                 value="{{ '%.2f'|format(expense.amount) }}"
                 class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-slate-100 focus:outline-none focus:border-brand" required />
        </label>
        <label class="block text-sm">
          <span class="mb-1 block text-slate-300">Date</span>
          <input type="date" name="date"
                 value="{{ expense.date }}"
                 class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-slate-100 focus:outline-none focus:border-brand" required />
        </label>
      </div>

      <label class="block text-sm">
        <span class="mb-1 block text-slate-300">Category</span>
        <select name="category"
                class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-slate-100 focus:outline-none">
          {% for c in categories %}
            <option value="{{ c }}" {% if expense.category == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </label>

      <div class="flex items-center gap-2 pt-2">
        <button class="flex-1 rounded-xl bg-brand/20 hover:bg-brand/30 text-brand px-4 py-2.5 font-medium border border-brand/30 transition"
                type="submit">Save Changes</button>
        <a class="rounded-xl bg-slate-800 hover:bg-slate-700 px-4 py-2.5 text-slate-300 border border-slate-700 text-center text-sm transition"
           href="{{ url_for('first_exp') }}">Cancel</a>
      </div>
    </form>
  </section>
</body>
</html>
